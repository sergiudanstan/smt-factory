version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot updates them while
  # keeping the pin, so pinning does not mean going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"

  # Test tooling (playwright, hash-pinned in .github/requirements-test.txt).
  # The pages themselves bundle three.js r147 by hand under src/vendor/; that is not a manifest.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    commit-message:
      prefix: "deps"
