name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; no job here needs to write anything.
permissions:
  contents: read

jobs:
  test:
    name: build and page checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install playwright (hash-pinned)
        run: python -m pip install --require-hashes -r .github/requirements-test.txt
      - name: Rebuild dist/ from src/
        run: python build.py
      - name: Fail if the committed dist/ is not what build.py produces
        run: |
          git diff --exit-code -- dist
          test -z "$(git status --porcelain -- dist)" || { git status --porcelain -- dist >&2; exit 1; }
      - name: Load every built page in headless Chrome, fail on any page or console error
        # Chrome is preinstalled on the runner image. tools/check.py exits 1 on a page
        # error or console.error, fast-forwards the simulation and prints a summary.
        # factory.html builds a whole plant and needs a longer load timeout on software GL.
        run: |
          set -euo pipefail
          for page in dist/*.html; do
            echo "::group::$page"
            python -I tools/check.py "$page" --ff 30 --timeout 240000 | tee "$RUNNER_TEMP/check.out"
            if grep -q '"noSim"' "$RUNNER_TEMP/check.out"; then echo "window.__sim missing in $page: the page did not start" >&2; exit 1; fi
            echo "::endgroup::"
          done
      - name: Perturbation check (a page error must make tools/check.py fail)
        run: |
          set -euo pipefail
          echo 'throw new Error("perturbation");' >> src/machines/printer.js
          python build.py --out "$RUNNER_TEMP/perturbed" printer
          if python -I tools/check.py "$RUNNER_TEMP/perturbed/printer.html"; then
            echo "check.py passed a page that throws on load: it cannot fail" >&2
            exit 1
          fi
          git checkout -- src/machines/printer.js

  audit:
    name: security audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install audit tooling (hash-pinned)
        run: python -m pip install --require-hashes -r .github/requirements-ci.lock
      - name: Known vulnerabilities in the CI toolchain
        run: pip-audit --strict --no-deps -r .github/requirements-ci.lock --progress-spinner off
      - name: Known vulnerabilities in the test dependencies
        run: pip-audit --strict --no-deps -r .github/requirements-test.txt --progress-spinner off
      - name: Lint Python (syntax errors and undefined names only; the legacy style findings are out of scope)
        run: ruff check --select E9,F63,F7,F82 build.py tools
      - name: Audit the workflows themselves
        run: zizmor --format plain .github/workflows/
